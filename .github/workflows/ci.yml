name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - run: uv sync --locked
      - run: uv run ruff check --quiet
      - run: uv run ruff format --check
      - run: uv run python -m app.quizzes check quizzes
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quiz_test
      - run: docker build -t quiz-lite .
      - name: Container smoke test
        run: |
          docker run -d --name app --network host -e PORT=8080 \
            -e DATABASE_URL=postgresql://quiz:quiz@localhost:5432/quiz_test quiz-lite
          curl -sf --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8080/healthz
          docker logs app 2>&1 | tee app.log
          # pytest already migrated this database, so boot must apply nothing (US4.3).
          ! grep -q '^applied' app.log
