[project]
name = "quiz-lite"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2>=3.1.6",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
