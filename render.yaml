# Render Blueprint. Field reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: quiz-lite
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-lite-db
          property: connectionString

databases:
  - name: quiz-lite-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: quiz
    user: quiz
    ipAllowList: []
